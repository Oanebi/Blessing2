<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note Pad</title>
</head>
<header>
    IDEAL NOTE PAD
</header>
<body>
    <form method="post" action="/notes">
      <input type="text" name="title" placeholder="write the title here">
      <textarea name="body" placeholder="write your note here"></textarea>
       <input type="checkbox" name="quote">Quote
      <input type="checkbox" name="total">Total
    <button name="submit">Submit</button>

    </form>
        {{range  .}}

    <div class="note">
    <div class="note-header">
        <span>{{.Title}}</span>
        <span>{{.Date}}</span>
    </div>
    <p>{{.Body}}</p>
</div>

    {{end}}
</body>
</html>
