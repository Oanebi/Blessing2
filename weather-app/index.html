<h2>AI Weather Predictor</h2>

<!-- The input box connected to our scrollable list -->
<input type="text" id="cityInput" list="countryList" placeholder="Search or scroll countries..." value="United States">

<!-- The scrollable list of options -->
<datalist id="countryList">
    <option value="United States">
    <option value="United Kingdom">
    <option value="Nigeria">
    <option value="Canada">
    <option value="Australia">
    <option value="Germany">
    <option value="Japan">
    <option value="Brazil">
    <option value="India">
</datalist>

<button onclick="getWeatherPrediction()">Predict Weather</button>
